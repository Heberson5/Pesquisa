# Exemplo para quem JÁ TEM nginx na VPS (com certbot). Coloque em /etc/nginx/sites-available/pesquisa
# e ative com: ln -s ../sites-available/pesquisa /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name pesquisa.sauberlich.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name pesquisa.sauberlich.com.br;
    ssl_certificate     /etc/letsencrypt/live/pesquisa.sauberlich.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pesquisa.sauberlich.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Substitui (não acrescenta) o IP: impede que o cliente forje o próprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
