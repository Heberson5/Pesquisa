<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Sauberlich System — Plataformas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: palco 16:9 (1280x720) escalado entre a barra de sistemas (topo) e a barra de telas (base).
   Visual único: moldura escura de apresentação, slides claros com as capturas reais dos sistemas. */
:root{
  --shell:#0B1522; --shell-2:#13213A; --shell-line:#22314A; --shell-fg:#E7EDF5; --shell-mut:#93A3B8;
  --paper:#F3F6F9; --white:#FFFFFF; --ink:#0E1A2B; --mut:#5D6B7C; --line:#DCE3EB;
  --brand:#0E2A47; --teal:#13A3B4; --grn:#16A34A;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--shell);color:var(--shell-fg);font-family:var(--body);overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.shell{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.topbar{display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--shell-line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--teal);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#06222A;font-size:18px}
.brand b{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.brand b span{color:var(--teal)}
.secnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.secnav::-webkit-scrollbar{display:none}
.secnav button{background:transparent;border:1px solid transparent;color:var(--shell-mut);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.secnav button i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.secnav button:hover{color:var(--shell-fg);background:var(--shell-2)}
.secnav button[aria-current="true"]{color:var(--shell-fg);background:var(--shell-2);border-color:var(--shell-line)}
.ibtn{background:var(--shell-2);border:1px solid var(--shell-line);color:var(--shell-fg);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.ibtn:hover{border-color:var(--teal)}
.ibtn svg{width:16px;height:16px}

.viewport{position:relative;overflow:hidden;min-height:0}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px}
.slide{position:absolute;inset:0;background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .3s ease}
.slide.on{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

.bottombar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--shell-line);min-width:0}
.navbtn{background:var(--shell-2);border:1px solid var(--shell-line);color:var(--shell-fg);height:36px;padding:0 14px;border-radius:9px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.navbtn:hover:not(:disabled){border-color:var(--teal)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn.next{background:var(--teal);border-color:var(--teal);color:#06222A}
.screens{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.screens .lbl{color:var(--shell-mut);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;align-self:center;white-space:nowrap;padding-right:4px}
.screens button{background:transparent;border:1px solid var(--shell-line);color:var(--shell-mut);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.screens button:hover{color:var(--shell-fg)}
.screens button[aria-current="true"]{background:var(--shell-fg);color:var(--shell);border-color:var(--shell-fg)}
.counter{font-variant-numeric:tabular-nums;color:var(--shell-mut);font-size:12.5px;white-space:nowrap;flex-shrink:0}
@media (max-width:640px){.brand b,.counter,.screens .lbl{display:none}.navbtn span{display:none}}

/* ---------- slides ---------- */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--ac);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--ac)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--grn)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px #16A34A33}
.badge-sec{display:inline-flex;background:var(--ac-soft);color:var(--ac);font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;padding:7px 12px;border-radius:99px;width:max-content}
.note{position:absolute;right:28px;bottom:14px;font-size:10.5px;color:var(--mut);font-weight:600}

.screen-slide{display:grid;grid-template-columns:290px 1fr;gap:30px;padding:36px 36px 40px}
.cap{display:flex;flex-direction:column;gap:13px;padding-top:4px;min-width:0}
.cap h2{font-family:var(--display);font-size:31px;line-height:1.06;margin:0;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
.cap p{margin:0;font-size:14px;line-height:1.55;color:var(--mut)}
.cap ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.cap li{font-size:13px;line-height:1.45;display:grid;grid-template-columns:16px 1fr;gap:8px}
.cap li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--ac);margin:6px 0 0 3px}
.cap .site{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:var(--white);border:1px solid var(--line);padding:9px 12px;border-radius:10px;text-decoration:none;width:max-content;max-width:100%}

.shot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.br{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(14,26,43,.18),0 0 0 1px rgba(14,26,43,.08);width:100%;display:flex;flex-direction:column}
.br-top{height:30px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 12px;background:#E9EEF3;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:#C9D2DC;display:block}
.url{flex:1;background:var(--white);border-radius:6px;height:20px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:10.5px;color:var(--mut);max-width:520px;white-space:nowrap;overflow:hidden}
.url svg{width:10px;height:10px;color:var(--grn);flex-shrink:0}
.url b{color:var(--ink);font-weight:600}
.br img{display:block;width:100%;height:auto}
.tablet{background:#111827;border-radius:26px;padding:14px;box-shadow:0 24px 60px rgba(14,26,43,.3);width:100%;max-width:820px}
.tablet img{display:block;width:100%;border-radius:12px}
.phone{background:#111827;border-radius:34px;padding:10px;box-shadow:0 24px 60px rgba(14,26,43,.3);width:300px}
.phone img{display:block;width:100%;border-radius:25px}

.cover{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;padding:52px 56px 56px}
.cover .l{display:flex;flex-direction:column;gap:15px;min-width:0}
.cover h1{font-family:var(--display);font-size:54px;line-height:1;margin:0;font-weight:800;letter-spacing:-1.4px;text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--ac)}
.cover .lead{font-size:16.5px;line-height:1.55;color:var(--mut);margin:0;max-width:34em}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:4px}
.feat div{font-size:12.5px;line-height:1.4;padding-left:13px;border-left:2px solid var(--ac);color:var(--mut)}
.feat b{display:block;font-size:13.5px;color:var(--ink)}
.urlcard{margin-top:auto;display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 18px;width:max-content;max-width:100%;text-decoration:none}
.urlcard .u{font-size:19px;font-weight:800;color:var(--ink);display:block}
.urlcard .go{width:34px;height:34px;border-radius:10px;background:var(--ac);display:grid;place-items:center;color:#fff}
.urlcard .go svg{width:16px;height:16px}
.tel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;align-self:start}
.tel h3{margin:0 0 6px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:800}
.tel button{display:grid;grid-template-columns:28px 1fr 16px;gap:12px;align-items:center;text-align:left;background:var(--paper);border:1px solid transparent;border-radius:10px;padding:8px 12px;color:var(--ink)}
.tel button:hover{border-color:var(--ac);background:var(--ac-soft)}
.tel .n{width:28px;height:28px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.tel b{display:block;font-size:13.5px}
.tel small{color:var(--mut);font-size:11.5px}
.tel svg{width:16px;height:16px;color:var(--mut)}

.opening{background:var(--brand);color:#E9F1F8;padding:56px 64px;display:grid;grid-template-rows:auto 1fr auto;gap:28px}
.opening .top{display:flex;align-items:center;gap:14px}
.opening .top .mark{width:46px;height:46px;font-size:27px;border-radius:12px}
.opening .top b{font-family:var(--display);font-size:22px;font-weight:600}
.opening h1{font-family:var(--display);font-size:72px;line-height:.96;letter-spacing:-2.2px;margin:0;font-weight:800;max-width:12em}
.opening h1 span{color:#5CD3DF}
.opening p{font-size:18px;line-height:1.55;color:#AFC3D6;max-width:40em;margin:18px 0 0}
.plat4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.plat4 button{background:#123659;border:1px solid #21507A;border-radius:14px;padding:16px;text-align:left;color:#E9F1F8;display:flex;flex-direction:column;gap:6px}
.plat4 button:hover{border-color:#5CD3DF}
.plat4 .k{width:10px;height:10px;border-radius:3px}
.plat4 b{font-size:16px}
.plat4 small{color:#9FB6CC;font-size:12px;line-height:1.4}
.plat4 .u{font-size:11.5px;color:#5CD3DF;font-weight:700;margin-top:4px}
.plat4 .live{color:#4ADE80}

.matrix{padding:48px 56px 52px;display:flex;flex-direction:column;gap:22px}
.matrix h2{font-family:var(--display);font-size:38px;margin:6px 0 0;letter-spacing:-1px;font-weight:800;line-height:1.05}
.matrix p{margin:0;color:var(--mut);font-size:14px}
.mx{width:100%;border-collapse:separate;border-spacing:0;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.mx th,.mx td{padding:11px 16px;border-bottom:1px solid #EDF1F5;text-align:center}
.mx tr:last-child td{border-bottom:0}
.mx th{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);background:#F7F9FB}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td:first-child b{display:block}
.mx td:first-child small{color:var(--mut);font-size:12px}
.ok{color:var(--grn);font-weight:800}
.no{color:#A3AEBB}

.closing{background:var(--brand);color:#E9F1F8;padding:56px 64px;display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.closing h2{font-family:var(--display);font-size:56px;line-height:1;letter-spacing:-1.6px;margin:0 0 18px;font-weight:800}
.closing h2 span{color:#5CD3DF}
.closing p{color:#AFC3D6;font-size:16.5px;line-height:1.55;margin:0}
.links{display:flex;flex-direction:column;gap:12px}
.links a{display:grid;grid-template-columns:12px 1fr auto;gap:16px;align-items:center;background:#123659;border:1px solid #21507A;border-radius:14px;padding:16px 20px;text-decoration:none}
.links a:hover{border-color:#5CD3DF}
.links i{width:12px;height:40px;border-radius:4px;display:block}
.links b{display:block;font-size:17px;color:#fff}
.links small{display:block;font-size:13px;color:#5CD3DF;font-weight:700;margin-top:2px}
.links .live{color:#4ADE80}
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">S</div><b>Sauberlich <span>System</span></b></div>
    <nav class="secnav" id="secnav" aria-label="Sistemas"></nav>
    <button class="ibtn" id="fsBtn" title="Tela cheia (F)" aria-label="Tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>
  <main class="viewport" id="viewport"><div class="stage" id="stage"></div></main>
  <footer class="bottombar">
    <button class="navbtn" id="prevBtn" aria-label="Slide anterior"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg><span>Anterior</span></button>
    <div class="screens" id="screens" aria-label="Telas desta seção"></div>
    <span class="counter" id="counter"></span>
    <button class="navbtn next" id="nextBtn" aria-label="Próximo slide"><span>Próximo</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </footer>
</div>

<script>

const SITES = {

      ['admin-admin_certificado','Modelo do certificado','Personalização','/admin/certificado','Certificado com a identidade da empresa',['Título e textos editáveis','Nome e cargo de quem assina','Pré-visualização com QR Code de validação','PDF de exemplo']],
      ['ana-validar','Validar certificado','Conferência pública','/validar','Certificado que se confere em segundos',['Validação pelo código ou pelo QR Code','Mostra titular, treinamento, carga horária, conclusão e empresa','Por LGPD, exibe só o necessário para conferir']],

      feat: [['Fila com aceite','A conversa fica com quem aceitou'],['Transferência','Para outro atendente, com observação'],['Respostas rápidas','Atalhos com a barra /'],['Dashboard e relatórios','Tempos médios e exportação']] },
    telas: [
      ['atendimento-fila','Fila','Conversas aguardando','/atendimento','Novas conversas esperam na fila',['Abas Ativos e Fila','Botão ACEITAR em cada conversa','Conexão (número de WhatsApp) indicada','Nova conversa iniciada pelo atendente']],

const stage = document.getElementById('stage');
const svgGo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';
const svgLock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const html = [];
const addSlide = (sec, name, id, cls, inner, desc='') => html.push(`<section class="slide ${cls}" data-sec="${sec}" data-name="${name}" data-desc="${desc}" id="${id}">${inner}</section>`);

addSlide('inicio','Capa','capa','opening',`
  <div class="top"><div class="mark">S</div><b>Sauberlich System</b></div>
  <div><h1>Quatro plataformas de gestão, <span>no ar.</span></h1>
  <p>Sistemas web desenvolvidos pela Sauberlich System, em produção e acessíveis pelo navegador. As telas a seguir são capturas dos próprios sistemas, com dados fictícios.</p></div>
  <div class="plat4">${Object.entries(SYS).map(([k,s])=>`<button data-to="${k}-capa"><i class="k" style="background:${s.dot}"></i><b>${s.nome}</b><small>${TELAS[k].capa.feat.slice(0,2).map(f=>f[0]).join(' · ')}</small><span class="u">${SITES[k]}</span><span class="live">No ar</span></button>`).join('')}</div>`);

const Y = '<span class="ok">✓</span>', N = '<span class="no">—</span>';
addSlide('inicio','Recursos em comum','comum','matrix',`
  <div><span class="badge-sec" style="--ac:#13A3B4;--ac-soft:#DDF3F5">Visão geral</span><h2>O que cada plataforma oferece</h2></div>
  <table class="mx"><tr><th>Recurso</th><th>Chamados</th><th>Treinamentos</th><th>Atendimento WhatsApp</th><th>Pesquisa de Satisfação</th></tr>
  <tr><td><b>Perfis e permissões</b><small>Cada pessoa vê só o que o papel dela permite</small></td><td>${Y}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
  <tr><td><b>Auditoria</b><small>Registro de quem fez o quê</small></td><td>${Y}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
  <tr><td><b>Dashboard e relatórios</b><small>Com exportação</small></td><td>${Y}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
  <tr><td><b>Tema claro e escuro</b></td><td>${Y}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
  <tr><td><b>Verificação em duas etapas (2FA)</b></td><td>${Y}</td><td>${Y}</td><td>${N}</td><td>${Y}</td></tr>
  <tr><td><b>Recursos de LGPD</b><small>Privacidade, dados do titular, retenção</small></td><td>${Y}</td><td>${Y}</td><td>${N}</td><td>${Y}</td></tr>
  </table>`);

for (const [k, s] of Object.entries(SYS)) {
  const t = TELAS[k], v = `--ac:${s.c};--ac-soft:${s.soft}`;
  addSlide(k,'Visão geral',`${k}-capa`,'cover',`<div class="l" style="${v}">
    <span class="badge-sec">${s.nome}</span><h1>${t.capa.titulo}</h1><p class="lead">${t.capa.lead}</p>
    <div class="feat">${t.capa.feat.map(f=>`<div><b>${f[0]}</b>${f[1]}</div>`).join('')}</div>
    <a class="urlcard" href="https://${SITES[k]}" target="_blank" rel="noopener"><div><span class="live">No ar</span><span class="u">${SITES[k]}</span></div><span class="go">${svgGo}</span></a></div>
    <div class="tel" style="${v}"><h3>Telas do sistema</h3>${t.telas.map((x,i)=>`<button data-to="${k}-${x[0]}"><span class="n">${i+1}</span><span><b>${x[1]}</b><small>${x[2]}</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>`).join('')}</div>`);
  for (const [file, nome, desc, path, h2, bullets, device] of t.telas) {
    const src = `telas/${k}-${file}.jpg`;
    const alt = `Tela ${nome} do sistema ${s.nome}`;
    const frame = device === 'tablet' ? `<div class="tablet"><img src="${src}" alt="${alt}" loading="lazy"></div>`
      : device === 'phone' ? `<div class="phone"><img src="${src}" alt="${alt}" loading="lazy"></div>`
      : `<div class="br"><div class="br-top"><div class="dots"><i></i><i></i><i></i></div><div class="url">${svgLock}https://<b>${SITES[k]}</b>${esc(path)}</div></div><img src="${src}" alt="${alt}" loading="lazy"></div>`;
    addSlide(k, nome, `${k}-${file}`, 'screen-slide', `<div class="cap" style="${v}">
      <span class="eyebrow">${s.nome}</span><h2>${h2}</h2>
      <ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      <a class="site" href="https://${SITES[k]}" target="_blank" rel="noopener"><span class="live">No ar</span>${SITES[k]}</a></div>
      <div class="shot">${frame}</div><span class="note">Tela real do sistema · dados fictícios</span>`, desc);
  }
}

addSlide('encerramento','Acessos','fim','closing',`<div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px"><div class="mark" style="width:42px;height:42px;font-size:24px;border-radius:11px">S</div><b style="font-family:var(--display);font-size:20px">Sauberlich System</b></div>
  <h2>Tudo isso já está <span>no ar.</span></h2>
  <p>As quatro plataformas estão em produção e são acessadas pelo navegador. Os nomes e números mostrados nas telas são fictícios.</p></div>
  <div class="links">${Object.entries(SYS).map(([k,s])=>`<a href="https://${SITES[k]}" target="_blank" rel="noopener"><i style="background:${s.dot}"></i><div><b>${s.nome}</b><small>${SITES[k]}</small></div><span class="live">No ar</span></a>`).join('')}</div>`);

stage.innerHTML = html.join('');

/* ---------- navegação ---------- */
const SECTIONS = [{id:'inicio',label:'Sauberlich System',c:'#13A3B4'}, ...Object.entries(SYS).map(([id,s])=>({id,label:s.nome,c:s.dot})), {id:'encerramento',label:'Acessos',c:'#5CD3DF'}];
const slides = [...document.querySelectorAll('.slide')];
const secnav = document.getElementById('secnav'), screens = document.getElementById('screens');
let cur = 0;
SECTIONS.forEach(s => { const b = document.createElement('button'); b.style.setProperty('--c', s.c); b.innerHTML = '<i></i>' + s.label; b.dataset.sec = s.id; b.onclick = () => go(slides.findIndex(x => x.dataset.sec === s.id)); secnav.appendChild(b); });
document.addEventListener('click', e => { const t = e.target.closest('[data-to]'); if (!t) return; const i = slides.findIndex(s => s.id === t.dataset.to); if (i >= 0) go(i); });
function renderScreens(sec){
  screens.innerHTML = '<span class="lbl">Telas</span>';
  slides.forEach((s, i) => { if (s.dataset.sec !== sec) return; const b = document.createElement('button'); b.textContent = s.dataset.name; b.dataset.i = i; b.onclick = () => go(i); screens.appendChild(b); });
  screens.dataset.sec = sec;
}
function go(i){
  if (i < 0 || i >= slides.length) return;
  slides.forEach((s, k) => { s.classList.toggle('on', k === i); s.setAttribute('aria-hidden', k !== i); });
  cur = i; const s = slides[i], sec = s.dataset.sec;
  [...secnav.children].forEach(b => b.setAttribute('aria-current', b.dataset.sec === sec));
  if (screens.dataset.sec !== sec) renderScreens(sec);
  screens.querySelectorAll('button').forEach(b => { const on = +b.dataset.i === i; b.setAttribute('aria-current', on); if (on) b.scrollIntoView({block:'nearest', inline:'nearest'}); });
  slides[i+1]?.querySelectorAll('img').forEach(im => im.loading = 'eager');
  document.getElementById('counter').textContent = (i+1) + ' / ' + slides.length;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === slides.length - 1;
  try { history.replaceState(null, '', '#' + s.id); } catch(e) {}
}
document.getElementById('prevBtn').onclick = () => go(cur - 1);
document.getElementById('nextBtn').onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(slides.length - 1);
  else if (/^[1-6]$/.test(e.key)) secnav.children[+e.key - 1]?.click();
  else if (e.key.toLowerCase() === 'f') toggleFs();
});
let tx = null; const vp = document.getElementById('viewport');
vp.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
vp.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); });
function toggleFs(){ try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); } catch(e) {} }
document.getElementById('fsBtn').onclick = toggleFs;
function fit(){ const pad = innerWidth < 640 ? 10 : 24; const sc = Math.min((vp.clientWidth - pad*2) / 1280, (vp.clientHeight - pad*2) / 720); stage.style.transform = 'translate(-50%,-50%) scale(' + Math.max(sc, .1) + ')'; }
new ResizeObserver(fit).observe(vp); fit();
const h = location.hash.slice(1);
const start = slides.findIndex(s => s.id === h), startSec = slides.findIndex(s => s.dataset.sec === h);
go(start >= 0 ? start : startSec >= 0 ? startSec : 0);
</script>
